services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: campusmind
      POSTGRES_USER: campusmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
    volumes:
      - campusmind_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusmind -d campusmind"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://campusmind:${POSTGRES_PASSWORD}@postgres:5432/campusmind
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - '3000:80'
    depends_on:
      - api
    restart: unless-stopped
volumes:
  campusmind_db:
